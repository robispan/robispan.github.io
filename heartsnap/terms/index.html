<!-- The app was renamed HeartSnap → LightPulse on 2026-09-29. Old /heartsnap/ URLs live on in
     shipped app builds and App Store metadata, and GitHub Pages cannot send a 301, so each
     old path is this stub. The script keeps any #fragment; the meta refresh covers no-JS. -->

<link rel="icon" href="/lightpulse/assets/app-icon.png" type="image/png">
<style>
  /* Self-contained: this page should paint correctly in the instant before the
     refresh fires, and remain usable for anyone whose browser ignores it. */
  :root { color-scheme: light dark; --bg: #FFFBF7; --ink: #16212A; --coral: #B02E20; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #101418; --ink: #F3EEE9; --coral: #FF8E7F; }
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 2rem;
    background-color: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: 1rem;
    line-height: 1.6;
    text-align: center;
  }
  a { color: var(--coral); }
</style>
</head>
<body>
